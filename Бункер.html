const BN=S('Алекс,Марта,Борис,Ирина,Глеб,Нина,Тимур,Лея,Роман,Вера,Эльза,Макс,Яна,Олег,Зоя,Кир,Ада,Дан,Мира,Лука');
let uid=0;
function av(seed){let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;const r=n=>{h=(h*1103515245+12345)>>>0;return (h>>>8)%n};const a=r(360),b=(a+60+r(80))%360,sk=['#f1c9a5','#d9a47a','#a97650','#7a4f35'][r(4)],hr=['#222','#5a3b22','#c9a24a','#8a2f2f','#ccc'][r(5)];
return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${a},70%,35%)"/><stop offset="1" stop-color="hsl(${b},70%,16%)"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><path d="M15 100q0-26 35-26t35 26z" fill="hsl(${b},50%,45%)"/><circle cx="50" cy="46" r="19" fill="${sk}"/><path d="M30 44q0-22 20-22t20 22q-8-10-20-10t-20 10z" fill="${hr}"/><circle cx="43" cy="48" r="2" fill="#111"/><circle cx="57" cy="48" r="2" fill="#111"/><path d="M44 57q6 4 12 0" stroke="#111" fill="none" stroke-width="1.6"/></svg>`)}
const BAN=(k)=>k?`<svg class="banner" viewBox="0 0 400 120"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2f2a"/><stop offset="1" stop-color="#0a1114"/></linearGradient></defs><rect width="400" height="120" fill="url(#s)"/><path d="M0 120L90 40l60 45 70-60 90 70 90-40v65z" fill="#0c1a18" stroke="#35ffa055"/><rect x="170" y="70" width="60" height="50" rx="4" fill="#16232a" stroke="#35ffa0"/><circle cx="200" cy="96" r="10" fill="none" stroke="#ffb23d" stroke-width="3"/></svg>`:`<svg class="banner" viewBox="0 0 400 120"><defs><radialGradient id="r"><stop offset="0" stop-color="#ff4d5e"/><stop offset="1" stop-color="#ff4d5e00"/></radialGradient></defs><rect width="400" height="120" fill="#0b0f13"/><circle cx="270" cy="50" r="70" fill="url(#r)"/><circle cx="270" cy="50" r="26" fill="#ff4d5e"/><path d="M0 120V80h30V55h25v30h30V65h25v55h35V70h30v50h40V75h30v45h40V60h28v60h30V85h27v35z" fill="#05080a"/></svg>`;
let me=ls.g('bk_me',null),L=null,G=null,T=null,CS='';
const app=$('#app');function show(h,c){clearInterval(T);app.className='scr';app.innerHTML=h;app.style.animation='none';app.offsetHeight;app.style.animation=''}
function profile(){const hist=ls.g('bk_hist',[]);CS=me?me.seed:Math.random().toString(36).slice(2);
show(`<div class="card"><h1>БУНКЕР</h1><div class="mut">Профиль выжившего</div><img id="pv" class="av-xl" src="${av(CS)}"><button class="ghost" onclick="reroll()">Сгенерировать аватар</button><input id="nick" maxlength="16" placeholder="Ваш никнейм" value="${me?esc(me.name):''}">${hist.length?`<div class="mut">Прошлые профили</div><div class="hist">${hist.map((h,i)=>`<button class="chip" onclick="pickH(${i})"><img src="${av(h.seed)}">${esc(h.name)}</button>`).join('')}</div>`:''}<button class="btn" onclick="saveMe()">Продолжить</button></div>`)}
function reroll(){CS=Math.random().toString(36).slice(2);$('#pv').src=av(CS)}
function pickH(i){const h=ls.g('bk_hist',[])[i];$('#nick').value=h.name;CS=h.seed;$('#pv').src=av(CS)}
function saveMe(){const n=$('#nick').value.trim();if(!n){$('#nick').focus();return}me={name:n,seed:CS};ls.s('bk_me',me);ls.s('bk_hist',[me,...ls.g('bk_hist',[]).filter(h=>h.name!==n)].slice(0,6));menu()}
function menu(){show(`<div class="card"><h1>БУНКЕР</h1><img class="av-xl" src="${av(me.seed)}"><h2>${esc(me.name)}</h2><button class="btn" onclick="createScr()">Создать лобби</button><button class="ghost" style="width:100%" onclick="joinScr()">Вступить в лобби по коду</button><button class="ghost" style="width:100%;border-color:#2c4150;color:var(--mt)" onclick="profile()">Сменить профиль</button></div>`)}
function createScr(){show(`<div class="card"><h2>Настройки лобби</h2><div class="mut">Вы станете админом</div><label style="width:100%">Игроков: <b id="pv2">8</b><input type="range" id="mx" min="2" max="16" value="8" oninput="$('#pv2').textContent=this.value"></label><label style="width:100%">Таймер обсуждения<select id="tm"><option value="30">30 секунд</option><option value="60">60 секунд</option><option value="90">90 секунд</option><option value="120">120 секунд</option></select></label><button class="btn" onclick="createLobby()">Создать</button><button class="ghost" style="width:100%" onclick="menu()">Назад</button></div>`)}
const gen=()=>Array.from({length:5},()=>R([...'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'])).join('');
function reg(f){const r=ls.g('bk_lob',{});f(r);ls.s('bk_lob',r)}
function mkp(u,bot){let name=u&&u.name,seed=u&&u.seed;if(bot){const used=L?L.players.map(p=>p.name):[];name=R(BN.filter(n=>!used.includes(n))||BN);seed=Math.random().toString(36).slice(2)}return{id:bot?'b'+(++uid):'me',name,seed,bot,ready:false,n:1,at:Date.now()+900+rnd(1500)}}
function addBot(){if(!L)return;const f=BN.filter(n=>!L.players.some(p=>p.name===n));if(!f.length)return;const p=mkp(null,true);p.name=R(f);L.players.push(p)}
function createLobby(){const max=+$('#mx').value,timer=+$('#tm').value,code=gen();L={code,max,timer,admin:true,open:true,players:[mkp(me,false)],target:Math.min(max,Math.max(2,max-rnd(3)))};reg(r=>r[code]={open:true,max,timer});lobbyScr()}
function joinScr(){show(`<div class="card"><h2>Вход по коду</h2><input id="jc" maxlength="6" placeholder="КОД" style="text-transform:uppercase;letter-spacing:.3em;font-size:24px"><div id="err" style="color:var(--rd)"></div><button class="btn" onclick="joinGo()">Войти</button><button class="ghost" style="width:100%" onclick="menu()">Назад</button></div>`)}
function joinGo(){const c=$('#jc').value.trim().toUpperCase(),r=ls.g('bk_lob',{})[c];if(!r||!r.open){$('#err').textContent='Лобби не найдено или закрыто';return}L={code:c,max:r.max,timer:r.timer,admin:false,open:true,players:[mkp(me,false)],target:Math.min(r.max,Math.max(2,r.max-rnd(2)))};for(let i=0;i<Math.min(2,r.max-1);i++)addBot();lobbyScr()}
function lobbyScr(){show(`<div class="lob"><div class="top2"><div style="text-align:left"><span class="mut">КОД КОМНАТЫ</span><div class="code" id="code"></div></div><div class="cnt" id="cnt"></div></div><div class="ring" id="ring"></div><div class="row" id="act"></div></div>`);L.ak='';L.int=setInterval(ltick,1400);ltick()}
function ltick(){if(!L)return;const now=Date.now();if(L.open&&L.players.length<L.target)addBot();L.players.forEach(p=>{if(p.bot&&!p.ready&&now>p.at)p.ready=true});
if(L.players.length>=2&&L.players.every(p=>p.ready)&&!L.starting){L.starting=1;lview();setTimeout(startGame,1000);return}lview()}
function lview(){$('#code').textContent=L.code;$('#cnt').textContent=`Игроки: ${L.players.length}/${L.max}`;
$('#ring').innerHTML=L.players.map(p=>{const h=`<div class="pl ${p.ready?'rdy':''} ${p.n?'pop':''}"><img src="${av(p.seed)}"><b>${esc(p.name)}</b></div>`;p.n=0;return h}).join('');
const m=L.players[0],k=[L.open,m.ready,L.starting].join();if(k!==L.ak){L.ak=k;$('#act').innerHTML=`<button class="btn" ${L.starting?'disabled':''} onclick="toggleReady()">${m.ready?'Отменить готовность':'Готово'}</button>`+(L.admin?`<button class="ghost dng" ${L.open?'':'disabled'} onclick="closeLobby()">${L.open?'Закрыть лобби':'Лобби закрыто'}</button><button class="ghost" onclick="newCode()">Сменить код</button>`:'')+`<button class="ghost" style="border-color:#2c4150;color:var(--mt)" onclick="leave()">Выйти</button>`}}
function toggleReady(){L.players[0].ready=!L.players[0].ready;L.ak='';lview()}
function closeLobby(){L.open=false;reg(r=>{if(r[L.code])r[L.code].open=false});L.ak='';lview()}
function newCode(){const o=L.code;L.code=gen();reg(r=>{const v=r[o];delete r[o];r[L.code]=v||{open:L.open,max:L.max,timer:L.timer}});lview()}
function leave(){if(L){clearInterval(L.int);if(L.admin)reg(r=>delete r[L.code])}L=null;menu()}
function mkCards(){return KEYS.map((k,i)=>({k,i,open:false,v:i==0?R(['Мужчина','Женщина'])+', '+(18+rnd(53))+' лет':i==3?(Math.random()<.15?'Абсолютно здоров':R(H1)+', '+R(H2)):R(D[i])}))}
function startGame(){clearInterval(L.int);const ps=L.players.map(p=>({...p,cards:mkCards(),alive:true,shown:[]}));
G={ps,me:ps[0],timer:L.timer,target:Math.max(1,ps.length>>1),round:1,cat:R(CATS).split('|'),bk:{d:`${R(SZ)}, расположен ${R(LOC)}. Состояние: ${R(ST)}.`,it:shuf(ITEMS).slice(0,2+rnd(14))}};L=null;catScr()}
function catScr(){show(`<div class="card wide"><div class="stage-tag">Этап 1 из 5 — Катастрофа</div>${BAN(0)}<h2>${G.cat[0]}</h2><p>${G.cat[1]}</p><p class="mut">Поверхность непригодна для жизни. Единственный шанс — бункер.</p><button class="btn" onclick="bunkerScr()">Далее</button></div>`)}
function bunkerScr(){show(`<div class="card wide"><div class="stage-tag">Этап 2 из 5 — Бункер</div>${BAN(1)}<p style="font-size:18px;margin:0">${G.bk.d}</p><div class="mut">Припасы и оборудование (${G.bk.it.length})</div><div class="items">${G.bk.it.map((x,i)=>`<span style="animation-delay:${i*.05}s">${ic(6)}${x}</span>`).join('')}</div><button class="btn" onclick="caseScr()">Далее</button></div>`)}
function caseScr(){show(`<div class="stage-tag" style="margin-bottom:10px">Этап 3 из 5 — Ваш чемодан · нажмите на карточку, чтобы открыть</div><div class="case" id="cs"><div class="lid">ЧЕМОДАН</div><div class="cg">${G.me.cards.map((c,i)=>`<div class="fc" style="--i:${i}" onclick="this.classList.toggle('f')"><div class="fi"><div class="fa">${ic(c.i)}<b>${c.k}</b></div><div class="fb"><small>${c.k}</small>${esc(c.v)}</div></div></div>`).join('')}</div></div><div id="cb" style="width:min(420px,100%);margin-top:16px"><button class="btn" onclick="caseDone()">Готово</button></div>`);setTimeout(()=>$('#cs').classList.add('open'),400)}
function caseDone(){$('#cb').innerHTML='<div class="wait"><div class="sp"></div>Ожидание остальных игроков…</div>';setTimeout(()=>{$('#cs').classList.add('closing');$('#cs').classList.remove('open');setTimeout(tableScr,1100)},1800)}
function tableScr(){show(`<div class="hdr" style="width:min(1100px,100%)"><div><b id="rd"></b><div class="mut" id="ph"></div></div><div class="tmr"><svg width="64" height="64"><circle cx="32" cy="32" r="28" fill="none" stroke="#243541" stroke-width="5"/><circle id="rg" cx="32" cy="32" r="28" fill="none" stroke="#35ffa0" stroke-width="5" stroke-dasharray="176" stroke-dashoffset="0" stroke-linecap="round"/></svg><span id="tm">--</span></div><div class="rem" id="rem"></div></div><div class="tw"><div class="stage"><div class="tb" id="tb"></div></div><aside class="sd" id="sd"></aside></div>`);talk()}
function upd(t){$('#tm').textContent=t;$('#rg').style.strokeDashoffset=176*(1-t/G.timer)}
function talk(){G.ph='talk';let t=G.timer;draw();upd(t);T=setInterval(()=>{t--;upd(Math.max(t,0));if(t<=0){clearInterval(T);pick()}},1000)}
function skipTalk(){clearInterval(T);pick()}
function pick(){clearInterval(T);G.ph='pick';G.sel=null;draw();$('#tm').textContent='--';if(!G.me.alive)setTimeout(doReveal,900)}
function selC(i){G.sel=i;draw()}
function doReveal(){const m=G.me;if(m.alive){const f=m.cards.filter(c=>!c.open);if(f.length){if(G.sel==null)return;const c=m.cards[G.sel];c.open=true;m.shown.push(c)}}
G.ps.forEach(p=>{if(p.alive&&p.bot){const f=p.cards.filter(c=>!c.open);if(f.length){const c=R(f);c.open=true;p.shown.push(c)}}});G.ph='reveal';draw();setTimeout(vote,2800)}
function vote(){G.ph='vote';G.v=undefined;draw();if(!G.me.alive)setTimeout(resolve,1500)}
function castVote(v){G.v=v;draw()}
function resolve(){const al=G.ps.filter(p=>p.alive),cnt={};let sk=0;const pop=R(al).id;
al.forEach(p=>{let v;if(p.bot){const o=al.filter(x=>x!==p);v=Math.random()<.15?'skip':(Math.random()<.55&&pop!=p.id?pop:R(o).id)}else v=G.v;if(v==null)return;if(v=='skip')sk++;else cnt[v]=(cnt[v]||0)+1});
let mx=0,top=[];for(const k in cnt){if(cnt[k]>mx){mx=cnt[k];top=[k]}else if(cnt[k]==mx)top.push(k)}
let msg;if(top.length!=1||sk>=mx)msg='Никто не изгнан: голоса разделились или большинство за пропуск.';else{const x=G.ps.find(p=>p.id==top[0]);x.alive=false;msg='Изгнан из бункера: '+x.name+'.'}
G.msg=msg;G.ph='res';draw();setTimeout(()=>{if(G.ps.filter(p=>p.alive).length<=G.target)endScr();else{G.round++;talk()}},3300)}
const PH={talk:'Обсуждение',pick:'Выберите карточку для раскрытия',reveal:'Карточки раскрыты',vote:'Голосование',res:'Итог голосования'};
function draw(){const n=G.ps.length,al=G.ps.filter(p=>p.alive).length;$('#rd').textContent='Раунд '+G.round;$('#ph').textContent=PH[G.ph];$('#rem').textContent='Осталось изгнать: '+(al-G.target);
const tb=$('#tb');tb.style.setProperty('--as',(n>10?40:n>6?50:60)+'px');
const old=tb.dataset.n!=n;if(old){tb.dataset.n=n;tb.innerHTML=`<div class="tc">БУНКЕР</div>`+G.ps.map((p,i)=>{const a=i/n*Math.PI*2-Math.PI/2;return `<div class="seat" id="s_${p.id}" style="left:${50+43*Math.cos(a)}%;top:${50+43*Math.sin(a)}%"><img src="${av(p.seed)}" onclick="openP('${p.id}')"><b></b><div class="sc"></div></div>`}).join('')}
G.ps.forEach(p=>{const s=$('#s_'+p.id);s.className='seat'+(p.alive?'':' dead')+(p.id=='me'?' me':'');s.querySelector('b').textContent=p.name;const sc=s.querySelector('.sc'),have=sc.children.length;p.shown.slice(have).forEach(c=>{const i=document.createElement('i');i.title=c.k;i.textContent=c.k+': '+c.v;sc.appendChild(i)})});
const m=G.me,sd=$('#sd');let h='';
if(G.ph=='talk')h=`<h3>Обсуждение</h3><p class="mut">Убедите остальных, что именно вы нужны бункеру. Нажмите на аватар, чтобы посмотреть карточки игрока.</p><button class="btn" onclick="skipTalk()">Завершить досрочно</button>`;
else if(G.ph=='pick'){const f=m.cards.map((c,i)=>[c,i]).filter(x=>!x[0].open);h=m.alive?`<h3>Что раскрыть?</h3>${f.length?f.map(([c,i])=>`<button class="opt ${G.sel==i?'on':''}" onclick="selC(${i})">${ic(c.i)}<span><small class="mut">${c.k}</small><br>${esc(c.v)}</small></span></button>`).join(''):'<p class="mut">Все карточки уже раскрыты.</p>'}<button class="btn" onclick="doReveal()">Готово</button>`:'<div class="wait"><div class="sp"></div>Вы изгнаны. Наблюдайте.</div>'}
else if(G.ph=='reveal')h='<div class="wait"><div class="sp"></div>Карточки раскрываются…</div>';
else if(G.ph=='vote'){h=m.alive?`<h3>Кого изгнать?</h3>${G.ps.filter(p=>p.alive&&p.id!='me').map(p=>`<button class="opt ${G.v==p.id?'on':''}" onclick="castVote('${p.id}')"><img src="${av(p.seed)}">${esc(p.name)}</button>`).join('')}<button class="opt ${G.v=='skip'?'on':''}" onclick="castVote('skip')">Скип — пропустить голосование</button><button class="btn" ${G.v==null?'disabled':''} onclick="resolve()">Подтвердить</button>`:'<div class="wait"><div class="sp"></div>Идёт голосование…</div>'}
else h=`<h3>Итог</h3><p>${G.msg}</p>`;
if(sd.dataset.k!=h){sd.dataset.k=h;sd.innerHTML=h}}
function openP(id){const p=G.ps.find(x=>x.id==id),mine=id=='me',cs=mine?p.cards:p.shown;
$('#md').innerHTML=`<div class="bd" onclick="this.remove()"><div class="mdl"><img src="${av(p.seed)}"><h2>${esc(p.name)}</h2><div class="mut">${p.alive?'В игре':'Изгнан'}</div>${cs.length?cs.map(c=>`<div class="tile ${mine&&!c.open?'hid':''}">${ic(c.i)}<span><small>${c.k}${mine&&!c.open?' · скрыто от других':''}</small>${esc(c.v)}</span></div>`).join(''):'<p class="mut">Пока ничего не раскрыто.</p>'}<p class="mut" style="font-size:12px">Нажмите в любом месте, чтобы закрыть</p></div></div>`}
function endScr(){const w=G.ps.filter(p=>p.alive),ok=G.me.alive;show(`<div class="card wide"><div class="stage-tag">Финал</div><h2 style="color:${ok?'var(--ac)':'var(--rd)'}">${ok?'Вы попали в бункер':'Вас изгнали из бункера'}</h2><div class="mut">Выжившие (${w.length})</div><div class="ring" style="margin:6px 0">${w.map(p=>`<div class="pl rdy"><img src="${av(p.seed)}"><b>${esc(p.name)}</b></div>`).join('')}</div><button class="btn" onclick="menu()">В главное меню</button></div>`)}
me&&me.name?menu():profile();
</script></body></html>
